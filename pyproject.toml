[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kestrel"
version = "0.0.1"
description = "Kestrel — a systematic trading bot (research, backtest, paper, then live)"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "pyarrow>=16.0",          # parquet engine for the local bar cache
    "python-telegram-bot>=21.0",
    "httpx>=0.27",            # Trading 212 has no SDK; its API is plain REST
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]
# Phase 5 only. Kept out of the default install so the core stays light.
news = [
    "transformers>=4.42",
    "torch>=2.3",
]

[tool.hatch.build.targets.wheel]
packages = ["kestrel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
